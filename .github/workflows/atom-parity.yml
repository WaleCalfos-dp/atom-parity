name: Atom parity
run-name: ${{ inputs.request_id && format('{0} [{1}]', inputs.remove_id && 'Remove' || (inputs.name || inputs.check_id || 'Check'), inputs.request_id) || 'Nightly check' }}

# Started from the web page (via the GitHub API) or on the nightly schedule.
#   figma_url + storybook_url → save a new check and run it
#   check_id                  → run one saved check
#   remove_id                 → remove a saved check and its report
#   nothing                   → run every saved check
on:
  workflow_dispatch:
    inputs:
      name: { description: 'Name for a new check', required: false }
      figma_url: { description: 'Figma link', required: false }
      storybook_url: { description: 'Storybook link', required: false }
      check_id: { description: 'Run one saved check', required: false }
      remove_id: { description: 'Remove a saved check', required: false }
      request_id: { description: 'Set by the web page to follow this run', required: false }
  schedule:
    - cron: '17 2 * * 1-5'   # 02:17 UTC, Monday to Friday

permissions:
  contents: write

concurrency:
  group: atom-parity
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Get the published site
        run: |
          git config --global user.name "atom-parity"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$REMOTE" site
          else
            mkdir site && cd site && git init -q -b gh-pages && git remote add origin "$REMOTE"
          fi

      - name: Work out the report address
        id: site
        run: echo "url=https://$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]').github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Save or remove a check
        id: plan
        env:
          NAME: ${{ inputs.name }}
          FIGMA_LINK: ${{ inputs.figma_url }}
          STORYBOOK_LINK: ${{ inputs.storybook_url }}
          CHECK_ID: ${{ inputs.check_id }}
          REMOVE_ID: ${{ inputs.remove_id }}
        run: |
          if [ -n "$REMOVE_ID" ]; then
            node src/cli.js remove-check --id "$REMOVE_ID"
            rm -rf "site/$REMOVE_ID"
            git add checks.json && git commit -qm "Remove parity check: $REMOVE_ID" && git push -q || true
            echo "mode=remove" >> "$GITHUB_OUTPUT"
          elif [ -n "$FIGMA_LINK" ] && [ -n "$STORYBOOK_LINK" ]; then
            node src/cli.js add-check --name "$NAME" --figma-url "$FIGMA_LINK" --storybook "$STORYBOOK_LINK"
            git add checks.json && git commit -qm "Save parity check: ${NAME:-new links}" && git push -q || true
            echo "mode=one" >> "$GITHUB_OUTPUT"
          elif [ -n "$CHECK_ID" ]; then
            echo "id=$CHECK_ID" >> "$GITHUB_OUTPUT"
            echo "mode=one" >> "$GITHUB_OUTPUT"
          else
            echo "mode=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the browser
        if: steps.plan.outputs.mode != 'remove'
        run: npx playwright install --with-deps chromium

      - name: Compare Figma with Storybook
        id: run
        if: steps.plan.outputs.mode != 'remove'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN || secrets.FIGMA }}
          PARITY_REPORT_URL: ${{ steps.site.outputs.url }}
          ONLY: ${{ steps.plan.outputs.id }}
        run: |
          set +e
          node src/cli.js run-all --site site-new --baselines site --status-from site/checks-status.json ${ONLY:+--only "$ONLY"}
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Publish the report
        run: |
          if [ -d site-new ]; then
            for d in site-new/*/; do [ -d "$d" ] || continue; id=$(basename "$d"); rm -rf "site/$id"; cp -R "$d" "site/$id"; done
            cp site-new/checks-status.json site-new/index.html site/
          else
            node src/cli.js site --site site --status-from site/checks-status.json
          fi
          touch site/.nojekyll
          cd site && git add -A && (git commit -qm "Update parity reports" && git push -q origin gh-pages || echo "Nothing changed")

      - name: Flag new problems
        if: steps.run.outputs.exit != '' && steps.run.outputs.exit != '0'
        run: |
          if [ "${{ steps.run.outputs.exit }}" = "2" ]; then echo "New problems since the last run: ${{ steps.site.outputs.url }}"; else echo "A check couldn't run: ${{ steps.site.outputs.url }}"; fi
          exit 1
