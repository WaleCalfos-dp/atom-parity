name: Atom parity
run-name: ${{ inputs.request_id && format('{0} [{1}]', inputs.remove_id && 'Remove' || inputs.ignore && 'Ignore' || (inputs.name || inputs.check_id || 'Check'), inputs.request_id) || 'Nightly check' }}

# Started from the web page (via the GitHub API) or on the nightly schedule.
#   figma_url + storybook_url → save a new check and run it
#   check_id                  → run one saved check
#   remove_id                 → remove a saved check and its report
#   ignore                    → ignore or restore issues (JSON from the report page), then rerun that check
#   nothing                   → run every saved check
on:
  workflow_dispatch:
    inputs:
      name: { description: 'Name for a new check', required: false }
      figma_url: { description: 'Figma link', required: false }
      storybook_url: { description: 'Storybook link', required: false }
      check_id: { description: 'Run one saved check', required: false }
      remove_id: { description: 'Remove a saved check', required: false }
      ignore: { description: 'Ignore or restore issues (set by the report page)', required: false }
      request_id: { description: 'Set by the web page to follow this run', required: false }
  schedule:
    - cron: '17 2 * * 1-5'   # 02:17 UTC, Monday to Friday

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Get the published site
        run: |
          git config --global user.name "atom-parity"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$REMOTE" site
          else
            mkdir site && cd site && git init -q -b gh-pages && git remote add origin "$REMOTE"
          fi

      - name: Work out the report address
        id: site
        run: echo "url=https://$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]').github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Save or remove a check
        id: plan
        env:
          NAME: ${{ inputs.name }}
          FIGMA_LINK: ${{ inputs.figma_url }}
          STORYBOOK_LINK: ${{ inputs.storybook_url }}
          CHECK_ID: ${{ inputs.check_id }}
          REMOVE_ID: ${{ inputs.remove_id }}
          IGNORE: ${{ inputs.ignore }}
        run: |
          if [ -n "$IGNORE" ]; then
            # Save the change to ignores.json on main (retrying if someone else saved at the same time), then rerun that check
            for attempt in 1 2 3 4 5; do
              node src/cli.js ignore
              git add ignores.json && git commit -qm "Update ignored issues" || break
              git push -q && break
              git fetch -q origin main && git reset -q --hard origin/main
              sleep $((attempt * 3))
            done
            echo "id=$(node -e 'console.log(JSON.parse(process.env.IGNORE).check)')" >> "$GITHUB_OUTPUT"
            echo "mode=one" >> "$GITHUB_OUTPUT"
          elif [ -n "$REMOVE_ID" ]; then
            node src/cli.js remove-check --id "$REMOVE_ID"
            rm -rf "site/$REMOVE_ID"
            git add checks.json && git commit -qm "Remove parity check: $REMOVE_ID" && git push -q || true
            echo "mode=remove" >> "$GITHUB_OUTPUT"
          elif [ -n "$FIGMA_LINK" ] && [ -n "$STORYBOOK_LINK" ]; then
            node src/cli.js add-check --name "$NAME" --figma-url "$FIGMA_LINK" --storybook "$STORYBOOK_LINK"
            git add checks.json && git commit -qm "Save parity check: ${NAME:-new links}" && git push -q || true
            echo "mode=one" >> "$GITHUB_OUTPUT"
          elif [ -n "$CHECK_ID" ]; then
            echo "id=$CHECK_ID" >> "$GITHUB_OUTPUT"
            echo "mode=one" >> "$GITHUB_OUTPUT"
          else
            echo "mode=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the browser
        if: steps.plan.outputs.mode != 'remove'
        run: npx playwright install --with-deps chromium

      - name: Compare Figma with Storybook
        id: run
        if: steps.plan.outputs.mode != 'remove'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN || secrets.FIGMA }}
          PARITY_REPORT_URL: ${{ steps.site.outputs.url }}
          ONLY: ${{ steps.plan.outputs.id }}
        run: |
          set +e
          node src/cli.js run-all --site site-new --baselines site --status-from site/checks-status.json ${ONLY:+--only "$ONLY"}
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Publish the report
        env:
          REMOVE_ID: ${{ inputs.remove_id }}
        run: |
          # Several checks can finish at once: publish, and if someone else published first, merge and try again.
          IDS=""
          if [ -d site-new ]; then for d in site-new/*/; do [ -d "$d" ] && IDS="$IDS,$(basename "$d")"; done; fi
          IDS="${IDS#,}"
          for attempt in 1 2 3 4 5; do
            cd "$GITHUB_WORKSPACE/site"
            if [ "$attempt" -gt 1 ]; then git fetch -q origin gh-pages && git reset -q --hard origin/gh-pages; fi
            cd "$GITHUB_WORKSPACE"
            [ -n "$REMOVE_ID" ] && rm -rf "site/$REMOVE_ID"
            for id in ${IDS//,/ }; do rm -rf "site/$id"; cp -R "site-new/$id" "site/$id"; done
            if [ -n "$IDS" ]; then
              node src/cli.js merge-status site/checks-status.json site-new/checks-status.json site/checks-status.json --only "$IDS"
              cp site-new/index.html site-new/app.css site-new/app.js site/
            else
              node src/cli.js site --site site --status-from site/checks-status.json
            fi
            touch site/.nojekyll
            cd site && git add -A
            git diff --cached --quiet && { echo "Nothing changed"; break; }
            git commit -qm "Update parity reports" && git push -q origin gh-pages && break
            echo "Someone published at the same time; merging and retrying"
            sleep $((attempt * 5))
          done

      - name: Flag new problems
        if: steps.run.outputs.exit != '' && steps.run.outputs.exit != '0'
        run: |
          if [ "${{ steps.run.outputs.exit }}" = "2" ]; then
            echo "::notice title=New problems found::New problems since the last run. See ${{ steps.site.outputs.url }}"
          else
            echo "::error title=A check couldn't run::See ${{ steps.site.outputs.url }}"
            exit 1
          fi
